# Secrets come from .env next to this file (gitignored).
# Without a name, Compose uses the folder name ("compose") and could share volumes with other projects
name: boundaries

services:
  postgres:
    image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
    # Only amd64 images are published; on Apple Silicon this runs under emulation
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: boundariesmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set in .env}
      PIPELINE_DB_PASSWORD: ${PIPELINE_DB_PASSWORD:?set in .env}
      LAB_DB_PASSWORD: ${LAB_DB_PASSWORD:?set in .env}
    volumes:
      # PG18 images keep data in /var/lib/postgresql/18/docker, so mount the parent
      - pgdata:/var/lib/postgresql
      # Mount the file, not the folder: a folder mount would hide the image's own 10_postgis.sh
      - ./postgres/init/20_roles.sh:/docker-entrypoint-initdb.d/20_roles.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    # Docker's 64 MB default is too small for parallel queries like the intersection SQL
    shm_size: 256mb
    mem_limit: 1g
    healthcheck:
      # TCP, not the socket: during first-start init a temporary server listens on the socket only
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "boundariesmap"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ../../api
    # Locally this tags the build as :local; on the server, deploy.sh writes IMAGE_TAG to .env and pulls from GHCR
    image: ghcr.io/betanyc/boundaries-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: boundariesmap
      DB_USER: api_user
      DB_PASSWORD: ${API_DB_PASSWORD:?set in .env}
    depends_on:
      postgres:
        # app.py opens its connection pool at import, so workers crash if Postgres isn't ready
        condition: service_healthy
    mem_limit: 512m

  caddy:
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: unless-stopped
    environment:
      # On the server, .env sets the public hostname(s)
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates; losing them means re-issuing and risks Let's Encrypt rate limits
      - caddy_data:/data
    mem_limit: 128m

  # --- Monitoring, Grafana reaches services by name rather than port.
  # Profile "monitoring": node-exporter and cAdvisor need a Linux host's mounts and cgroups, so these start
  # only where COMPOSE_PROFILES=monitoring (deploy.sh writes it on the server). Locally: --profile monitoring.

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 512m

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    profiles: [monitoring]
    restart: unless-stopped
    # Read the host's filesystems and processes,
    command:
      - --path.rootfs=/host
      # On the Compose network these would describe this container's network, not the server's
      - --no-collector.netdev
      - --no-collector.netstat
      - --no-collector.sockstat
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    profiles: [monitoring]
    restart: unless-stopped
    # Per-container CPU and memory come from the host's cgroups
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s # matches the scrape interval
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 256m

volumes:
  pgdata:
  caddy_data:
  prometheus_data:
